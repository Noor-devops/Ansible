- name: checking number of live_sessions
  hosts: local
  connection: local
  vars_prompt:
    name: live_sessions
    prompt: "please enter the no of live_sessions"
    private: false
  tasks:
  - name: is ansible more than 5 sessions
    debug:
      msg: "yes, ansible tooks more than 5 sessions"
    when: live_sessions | int > 5
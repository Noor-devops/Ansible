- name: checking even or odd
  hosts: local
  connection: local
  vars_prompt:
    name: number
    prompt: "Please enter the number: "
    private: false
  tasks:
  - name: printing even or odd from promt
    debug:
      msg: "given number is {{ number }} even"
    when: number % 2 == 0
    
    name: printing even or odd from promt
    debug:
      msg: "given number is {{ number }} even"
    when: number % 2 != 0
    